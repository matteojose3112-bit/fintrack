databases:
  - name: fintrack-db
    plan: free
    databaseName: fintrack
    user: fintrack

services:
  - type: web
    name: fintrack-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ENVIRONMENT
        value: production
      - key: FINTRACK_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fintrack-db
          property: connectionString
      - key: CORS_ORIGINS
        value: http://localhost:5173,https://fintrack-web-int6.onrender.com

  - type: web
    name: fintrack-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://fintrack-api-l1wa.onrender.com/api
