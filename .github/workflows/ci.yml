name: FinTrack CI

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --package-lock-only
      - name: Commit generated lockfile to the pull-request branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Frontend lockfile is already current."
          else
            git commit -m "build: add reproducible frontend package lock"
            git push origin "HEAD:${PR_HEAD_REF}"
          fi
      - run: npm ci
      - name: Preserve generated frontend lockfile
        uses: actions/upload-artifact@v4
        with:
          name: fintrack-frontend-lockfile
          path: frontend/package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Review dependency audit
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); console.log("Audit summary:", JSON.stringify(a.metadata?.vulnerabilities || {})); for (const [name, item] of Object.entries(a.vulnerabilities || {})) console.log(name, item.severity, "direct=" + item.isDirect, "range=" + item.range, "fix=" + JSON.stringify(item.fixAvailable));'
      - run: npm run test -- --run
      - run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall -q backend/app
      - run: cd backend && DATABASE_URL=sqlite:///./migration-test.db alembic upgrade head
      - run: pytest -q backend/tests

  
  postgres-migration:
    name: Populated PostgreSQL migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fintrack
          POSTGRES_PASSWORD: fintrack
          POSTGRES_DB: fintrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fintrack -d fintrack"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://fintrack:fintrack@localhost:5432/fintrack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - run: pytest -q backend/tests/test_money_migration.py::test_populated_legacy_postgresql_data_survives_fixed_precision_migration
